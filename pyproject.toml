[project]
name = "chalk"
version = "0.1.0"
description = "Local-first syllabus maintenance and course material generation toolkit for university faculty"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=chalk --cov=ui --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["chalk", "ui"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Chalk runs on the instructor's own computer, so "today" and archive
# timestamps are deliberately the local date and time.
ignore = ["DTZ005", "DTZ011"]

[tool.ruff.lint.per-file-ignores]
# Tests build local (naive) times to match the code above.
"tests/*" = ["DTZ001"]
