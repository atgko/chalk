# Runs the test suite (with the 80% coverage gate from pyproject.toml) on
# every pull request and every push to master. Windows and macOS are what
# instructors run Chalk on; Linux on the oldest supported Python catches
# version-specific breakage. The Linux job also runs ruff (lint rules are
# the same on every OS, so once is enough).
name: Tests

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.14"
          - os: macos-latest
            python: "3.14"
          - os: ubuntu-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: ruff check
        if: matrix.os == 'ubuntu-latest'
        run: python -m ruff check .
      - run: python -m pytest -q
